<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蔬菜水果小百科 · 歌单</title>
<style>
  :root{
    --bg:#f6f8f4; --card:#ffffff; --ink:#1f2a22; --muted:#7a8a7e;
    --line:#e6ece4; --accent:#3aa655; --accent2:#f08a24; --active:#eaf7ee;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:520px;margin:0 auto;padding:16px 14px 40px}
  header h1{font-size:20px;margin:6px 0 2px;font-weight:700}
  header p{margin:0 0 14px;color:var(--muted);font-size:13px}
  .player{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px 16px;box-shadow:0 4px 18px rgba(40,70,45,.06)}
  .cover{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .badge{width:54px;height:54px;border-radius:14px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;font-size:26px}
  .now{flex:1;min-width:0}
  .now .ttl{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now .sub{color:var(--muted);font-size:12px}
  .bar{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin:4px 0 2px}
  .bar input[type=range]{flex:1;accent-color:var(--accent);height:4px}
  .ctrls{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px}
  .btn{border:none;background:var(--bg);border-radius:50%;width:46px;height:46px;
    font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
  .btn:active{transform:scale(.94)}
  .btn.play{width:58px;height:58px;background:var(--accent);color:#fff;font-size:24px;
    box-shadow:0 6px 16px rgba(58,166,85,.35)}
  .mode{font-size:13px;padding:9px 14px;border-radius:22px;background:var(--bg);
    border:1px solid var(--line);cursor:pointer;color:var(--ink);font-weight:600}
  .search{width:100%;margin:16px 0 8px;padding:11px 14px;border:1px solid var(--line);
    border-radius:12px;font-size:14px;background:var(--card);color:var(--ink);outline:none}
  .search:focus{border-color:var(--accent)}
  .list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);
    border-radius:14px;overflow:hidden}
  .list li{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;
    display:flex;align-items:center;gap:10px;font-size:14px}
  .list li:last-child{border-bottom:none}
  .list li:hover{background:var(--active)}
  .list li.active{background:var(--active);color:var(--accent);font-weight:700}
  .list li .no{color:var(--muted);font-variant-numeric:tabular-nums;width:22px;flex:0 0 auto;text-align:right}
  .list li.active .no{color:var(--accent)}
  .list li .eq{margin-left:auto;font-size:12px;color:var(--accent);display:none}
  .list li.active .eq{display:inline}
  .hint{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🥬 蔬菜水果小百科 · 歌单</h1>
    <p>共 68 首 · 点击列表选曲 · 支持列表循环 / 单曲循环</p>
  </header>

  <section class="player">
    <div class="cover">
      <div class="badge">🎵</div>
      <div class="now">
        <div class="ttl" id="curTitle">未播放</div>
        <div class="sub" id="curSub">点击下方按钮或歌单开始</div>
      </div>
    </div>
    <div class="bar">
      <span id="curTime">0:00</span>
      <input type="range" id="progress" min="0" max="100" value="0" step="0.1">
      <span id="durTime">0:00</span>
    </div>
    <div class="ctrls">
      <button class="btn" id="prevBtn" title="上一首">⏮</button>
      <button class="btn play" id="playBtn" title="播放/暂停">▶</button>
      <button class="btn" id="nextBtn" title="下一首">⏭</button>
      <button class="mode" id="modeBtn" title="切换循环模式">🔁 列表循环</button>
    </div>
  </section>

  <input class="search" id="search" type="text" placeholder="🔍 搜索歌曲，如：辣椒、苹果" autocomplete="off">
  <ul class="list" id="list"></ul>
  <p class="hint">音频由 jsDelivr CDN 提供 · 国内访问偶有波动属正常</p>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
const BASE = "https://cdn.jsdelivr.net/gh/nebula-fangyi/vf-music@main/music/";
const tracks = [{"t": "1 辣　椒", "f": "001-1 辣　椒.mp3"}, {"t": "2 白　菜", "f": "002-2 白　菜.mp3"}, {"t": "3 西红柿", "f": "003-3 西红柿.mp3"}, {"t": "4 藕", "f": "004-4 藕.mp3"}, {"t": "5 菠　菜", "f": "005-5 菠　菜.mp3"}, {"t": "6 黄　瓜", "f": "006-6 黄　瓜.mp3"}, {"t": "7 洋　葱", "f": "007-7 洋　葱.mp3"}, {"t": "8 玉　米", "f": "008-8 玉　米.mp3"}, {"t": "9 胡萝卜", "f": "009-9 胡萝卜.mp3"}, {"t": "10 马铃薯", "f": "010-10 马铃薯.mp3"}, {"t": "11 大　蒜", "f": "011-11 大　蒜.mp3"}, {"t": "12 南　瓜", "f": "012-12 南　瓜.mp3"}, {"t": "13 豌　豆", "f": "013-13 豌　豆.mp3"}, {"t": "14 蘑　菇", "f": "014-14 蘑　菇.mp3"}, {"t": "15 青　菜", "f": "015-15 青　菜.mp3"}, {"t": "16 紫甘蓝", "f": "016-16 紫甘蓝.mp3"}, {"t": "17 生　菜", "f": "017-17 生　菜.mp3"}, {"t": "18 葱", "f": "018-18 葱.mp3"}, {"t": "19 红　薯", "f": "019-19 红　薯.mp3"}, {"t": "20 丝　瓜", "f": "020-20 丝　瓜.mp3"}, {"t": "21 四季豆", "f": "021-21 四季豆.mp3"}, {"t": "22 毛　豆", "f": "022-22 毛　豆.mp3"}, {"t": "23 卷心菜", "f": "023-23 卷心菜.mp3"}, {"t": "24 西兰花", "f": "024-24 西兰花.mp3"}, {"t": "25 姜", "f": "025-25 姜.mp3"}, {"t": "26 莴　苣", "f": "026-26 莴　苣.mp3"}, {"t": "27 花　生", "f": "027-27 花　生.mp3"}, {"t": "28 扁　豆", "f": "028-28 扁　豆.mp3"}, {"t": "29 花椰菜", "f": "029-29 花椰菜.mp3"}, {"t": "30 茄　子", "f": "030-30 茄　子.mp3"}, {"t": "31 苦　瓜", "f": "031-31 苦　瓜.mp3"}, {"t": "32 冬　瓜", "f": "032-32 冬　瓜.mp3"}, {"t": "33 香　菇", "f": "033-33 香　菇.mp3"}, {"t": "34 山　药", "f": "034-34 山　药.mp3"}, {"t": "35 芹　菜", "f": "035-35 芹　菜.mp3"}, {"t": "36 萝　卜", "f": "036-36 萝　卜.mp3"}, {"t": "37 苹　果", "f": "037-37 苹　果.mp3"}, {"t": "38 梨　子", "f": "038-38 梨　子.mp3"}, {"t": "39 香　蕉", "f": "039-39 香　蕉.mp3"}, {"t": "40 菠　萝", "f": "040-40 菠　萝.mp3"}, {"t": "41 西　瓜", "f": "041-41 西　瓜.mp3"}, {"t": "42 金　橘", "f": "042-42 金　橘.mp3"}, {"t": "43 杧　果", "f": "043-43 杧　果.mp3"}, {"t": "44 草　莓", "f": "044-44 草　莓.mp3"}, {"t": "45 香　瓜", "f": "045-45 香　瓜.mp3"}, {"t": "46 黑布林", "f": "046-46 黑布林.mp3"}, {"t": "47 柠　檬", "f": "047-47 柠　檬.mp3"}, {"t": "48 猕猴桃", "f": "048-48 猕猴桃.mp3"}, {"t": "49 橙　子", "f": "049-49 橙　子.mp3"}, {"t": "50 桃　子", "f": "050-50 桃　子.mp3"}, {"t": "51 榴　梿", "f": "051-51 榴　梿.mp3"}, {"t": "52 哈密瓜", "f": "052-52 哈密瓜.mp3"}, {"t": "53 火龙果", "f": "053-53 火龙果.mp3"}, {"t": "54 樱　桃", "f": "054-54 樱　桃.mp3"}, {"t": "55 核　桃", "f": "055-55 核　桃.mp3"}, {"t": "56 柿　子", "f": "056-56 柿　子.mp3"}, {"t": "57 枇　杷", "f": "057-57 枇　杷.mp3"}, {"t": "58 蓝　莓", "f": "058-58 蓝　莓.mp3"}, {"t": "59 李　子", "f": "059-59 李　子.mp3"}, {"t": "60 提　子", "f": "060-60 提　子.mp3"}, {"t": "61 柚　子", "f": "061-61 柚　子.mp3"}, {"t": "62 荸　荠", "f": "062-62 荸　荠.mp3"}, {"t": "63 鳄　梨", "f": "063-63 鳄　梨.mp3"}, {"t": "64 石　榴", "f": "064-64 石　榴.mp3"}, {"t": "65 橄　榄", "f": "065-65 橄　榄.mp3"}, {"t": "66 橘　子", "f": "066-66 橘　子.mp3"}, {"t": "67 木　瓜", "f": "067-67 木　瓜.mp3"}, {"t": "68 葡　萄", "f": "068-68 葡　萄.mp3"}];

const audio = document.getElementById("audio");
const listEl = document.getElementById("list");
const curTitle = document.getElementById("curTitle");
const curSub = document.getElementById("curSub");
const progress = document.getElementById("progress");
const curTime = document.getElementById("curTime");
const durTime = document.getElementById("durTime");
const playBtn = document.getElementById("playBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const modeBtn = document.getElementById("modeBtn");
const searchEl = document.getElementById("search");

let cur = -1;
let mode = "loop"; // loop=列表循环, one=单曲循环, seq=顺序播放
const MODES = [["loop","🔁 列表循环"],["one","🔂 单曲循环"],["seq","▶ 顺序播放"]];
let mi = 0;

// 渲染歌单
tracks.forEach((tr, i) => {
  const li = document.createElement("li");
  li.dataset.i = i;
  li.innerHTML = '<span class="no">' + (i+1) + '</span><span class="nm">' + tr.t + '</span><span class="eq">▶ 播放中</span>';
  li.addEventListener("click", () => play(i));
  listEl.appendChild(li);
});

function fmt(s){
  if(!isFinite(s) || s < 0) return "0:00";
  s = Math.floor(s);
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}

function highlight(){
  [...listEl.children].forEach((li, i) => li.classList.toggle("active", i === cur));
  if(cur >= 0) listEl.children[cur].scrollIntoView({block:"nearest"});
}

function play(i){
  if(i < 0 || i >= tracks.length) return;
  cur = i;
  audio.src = BASE + encodeURIComponent(tracks[i].f);
  audio.play().catch(()=>{});
  curTitle.textContent = tracks[i].t;
  curSub.textContent = "第 " + (i+1) + " / " + tracks.length + " 首";
  playBtn.textContent = "⏸";
  highlight();
}

function playPause(){
  if(cur < 0){ play(0); return; }
  if(audio.paused){ audio.play().catch(()=>{}); playBtn.textContent = "⏸"; }
  else { audio.pause(); playBtn.textContent = "▶"; }
}

function next(){
  if(cur < 0){ play(0); return; }
  let n = cur + 1;
  if(n >= tracks.length){
    if(mode === "seq"){ audio.pause(); cur = -1; playBtn.textContent = "▶"; curTitle.textContent = "播放完毕"; curSub.textContent = "点击任意歌曲重新开始"; highlight(); return; }
    n = 0; // loop
  }
  play(n);
}

function prev(){
  if(cur < 0){ play(0); return; }
  let p = cur - 1;
  if(p < 0) p = tracks.length - 1;
  play(p);
}

audio.addEventListener("ended", () => {
  if(mode === "one"){ audio.currentTime = 0; audio.play().catch(()=>{}); }
  else next();
});

audio.addEventListener("timeupdate", () => {
  if(audio.duration) progress.value = audio.currentTime;
  curTime.textContent = fmt(audio.currentTime);
});
audio.addEventListener("loadedmetadata", () => {
  progress.max = audio.duration || 100;
  durTime.textContent = fmt(audio.duration);
});
audio.addEventListener("play", () => { playBtn.textContent = "⏸"; });
audio.addEventListener("pause", () => { playBtn.textContent = "▶"; });

progress.addEventListener("input", () => { audio.currentTime = parseFloat(progress.value); });
playBtn.addEventListener("click", playPause);
nextBtn.addEventListener("click", next);
prevBtn.addEventListener("click", prev);

modeBtn.addEventListener("click", () => {
  mi = (mi + 1) % MODES.length;
  mode = MODES[mi][0];
  modeBtn.textContent = MODES[mi][1];
});

searchEl.addEventListener("input", () => {
  const q = searchEl.value.trim().toLowerCase();
  [...listEl.children].forEach(li => {
    const name = tracks[parseInt(li.dataset.i)].t.toLowerCase();
    li.style.display = (!q || name.includes(q)) ? "" : "none";
  });
});
</script>
</body>
</html>
